<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PossoPretter</title>
  <link rel="stylesheet" href="./resources/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Boldonse&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

</head>
<body>
<section class="content">

  <div class="titleBold">
    <img id="logo" src="./resources/img/Logo.png" alt="PossoPretter Logo">
  </div>
  <div class="navigation">
<div class="options">

    <select class="selectBox" id="mode">
      <option value="popular">Popular</option>
      <option value="random">Random</option>
      <option value="top_rated">Top Rated</option>
      <option value="now_playing">Now Playing</option>
    </select>

          <button id="randomButton">Refresh</button>          

</div>
<div class="search">
  <div class="search-container">
    <input id="search" type="text" class="searchBar" placeholder="Search movie...">
    <ul id="suggestions" class="suggestions-dropdown"></ul>
  </div>
</div>
</div>

</div>

  <div class="wrapper">

    <div id="loadingText" class="loading-text"></div>
    
    <div id="movieTitle" class="movie-title"></div>

    <div class="pair">
      <div class="img-container mask-left">
        <img class="img-base" src="./resources/img/1yQR4iUb5ChImcZ0yDsE18TpiaU.webp" alt="image">
      </div>
      <div class="img-container-reversed mask-right">
        <img class="img-mirror" src="./resources/img/1yQR4iUb5ChImcZ0yDsE18TpiaU.webp"  alt="image">


      </div>

    </div>

    <input id="slider" type="range" min="0" max="100" value="50" />
    
    <div class="controls">
      <div class="controls-side">
        <div class="poster-selector">
          <select id="posterSelect" class="posterDropdown">
          </select>
        </div>
      </div>

      <div class="reverse-wrapper">
        <button id="swapButton" class="reverse-button">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 4v6h6M23 20v-6h-6"></path>
            <path d="M20.49 9A9 9 0 0 0 5.64 5.64M3.51 15A9 9 0 0 0 18.36 18.36"></path>
          </svg>
        </button>
      </div>

      <div class="controls-side">
        <button id="saveButton">Save Image</button>
      </div>
    </div>
</section>
  <script src="config.js"></script>
  <script src="./javascript/imgrvrs.js"></script>
  <script src="./javascript/main.js"></script>

  
</body>
</html>
